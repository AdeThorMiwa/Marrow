server:
  port: 8081

database:
  host: localhost
  port: "5432"
  user: postgres
  password: postgres
  name: marrow
  ssl_mode: disable

ingest:
  scheduler_cron: "@every 1m"
  retry_interval: 1m
  default_batch_limit: 20
  broken_threshold: 5
  stale_threshold: 5
  retry_backoff_base: 90m
  broken_backoff_max: 24h
  queue_buffer_size: 256
  queue_workers: 4

enrichment:
  ollama_base_url: http://localhost:11434
  embedding_model: nomic-embed-text
  whisper_base_url: http://localhost:8090
  queue_buffer_size: 256
  queue_workers: 2
  retry_max_attempts: 3
  retry_backoff_base: 30s

feed:
  default_page_size: 20
  overfetch_factor: 5

# Deliberately empty — real credentials go in a local, untracked .env
# (APP_TWITTER_USERNAME / APP_TWITTER_COOKIES), never in a committed config
# file. See internal/config.go's TwitterConfig doc comment.
twitter:
  username: ""
  cookies: ""

# Same rule as twitter above — APP_INSTAGRAM_USERNAME / APP_INSTAGRAM_COOKIES.
instagram:
  username: ""
  cookies: ""
