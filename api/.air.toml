#:schema https://json.schemastore.org/any.json

env_files = [".env"]
root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = ["serve"]
  bin = "./tmp/main"
  cmd = "go build -o ./tmp/main ./cmd/marrow"
  delay = 1000
  entrypoint = ["./tmp/main"]
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "venv"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  # Prepends the venv's bin/ so `python3` (shelled out to by the Instagram
  # and YouTube adapters) resolves to the venv's interpreter — instead of
  # whatever python3 happens to be first on the ambient shell PATH. Must be
  # $PWD, not ./venv/bin — Go's os/exec refuses to resolve a *relative*
  # PATH entry (since Go 1.19, to stop an accidental local override), so a
  # relative prefix here makes python3 unresolvable at runtime.
  full_bin = "PATH=\"$PWD/venv/bin:$PATH\" ./tmp/main"
  ignore_dangerous_root_dir = false
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html"]
  include_file = []
  kill_delay = "0s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  mode = ""
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = false

[misc]
  clean_on_exit = false

[proxy]
  app_port = 0
  app_start_timeout = 0
  enabled = false
  proxy_port = 0

[screen]
  clear_on_rebuild = false
  keep_scroll = true
